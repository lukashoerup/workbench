# Workbench watchdog checks. One check per line; blank lines and # ignored.
#
#   unit       <systemd-unit>                  system unit must be active
#   user       <systemd-unit>                  --user unit must be active
#   heartbeat  <label> <file> <max-age-secs>   file must exist and be fresh
#   net        <host>                          host must answer ping
#   disk       <mountpoint> <min-free-pct>     free space floor
#
# Units that are not installed yet are reported as MISSING, not FAILED, so this
# file can list Phase 2+ services before they exist.

net        1.1.1.1
disk       /            10

# The phone's view of this machine. If this timer dies, STATUS.md silently goes
# stale and everything looks fine from outside — so watch it explicitly.
user       workbench-status.timer
user       workbench-watchdog.timer

# --- Phase 2: installed 2026-07-22 ---
unit       ollama.service
unit       tailscaled.service

# --- Phase 4: scraper jobs write their marker file on each successful run ---
# heartbeat dba-scraper    /home/lukashoerup/.local/state/workbench/heartbeats/dba      7200
# heartbeat vinted-scraper /home/lukashoerup/.local/state/workbench/heartbeats/vinted   7200

# --- The §8 reporting jobs (added 2026-08-04) ---
# Both write their marker on a SUCCESSFUL run only, so a stale marker means the
# job stopped working rather than merely stopped finding things.
#
# The brief runs at 03:15 daily; 30h covers one missed night without crying wolf
# over a reboot. The gardener runs Sunday 04:30 and deliberately skips its run
# when a work block holds the Claude lock, so 9 days tolerates one skipped week
# — two in a row is a real problem and should surface.
user       workbench-triage.timer
heartbeat  triage    /home/lukashoerup/.local/state/workbench/heartbeats/triage    108000
user       workbench-gardener.timer
heartbeat  gardener  /home/lukashoerup/.local/state/workbench/heartbeats/gardener  777600

# --- The link to GitHub (added 2026-07-26) ---
# If this dies the box stops collecting changes and runs old code forever, with
# no outward sign — everything already installed keeps working. 40 min covers
# three missed 10-minute runs.
user       workbench-apply.timer
heartbeat  apply  /home/lukashoerup/.local/state/workbench/heartbeats/apply  2400
